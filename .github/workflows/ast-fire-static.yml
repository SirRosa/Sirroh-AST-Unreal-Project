name: AST Fire static checks

on:
  push:
    branches:
      - work/niagara-fire-stage2
    paths:
      - "Automation/ASTFire/**"
      - "Plugins/ASTFireRuntime/**"
      - ".github/workflows/ast-fire-static.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Unreal Python automation syntax
        run: |
          python -m py_compile Automation/ASTFire/fix_stage2_materials.py
          python -m py_compile Automation/ASTFire/finalize_stage2.py
          python -m py_compile Automation/ASTFire/setup_stage4_volume.py
          python -m py_compile Automation/ASTFire/test_stage4_source.py
          python -m py_compile Automation/ASTFire/test_stage5_heat_reference.py
          python Automation/ASTFire/test_stage5_heat_reference.py
          python -m py_compile Automation/ASTFire/setup_stage6_igniter.py
          python -m py_compile Automation/ASTFire/test_stage6_shape_and_ignition.py
          python Automation/ASTFire/test_stage6_shape_and_ignition.py
          python -m py_compile Automation/ASTFire/test_stage7_mesh_motion.py
          python Automation/ASTFire/test_stage7_mesh_motion.py
          python -m py_compile Automation/ASTFire/setup_stage8_surface.py
          python -m py_compile Automation/ASTFire/test_stage8_integrated.py
          python Automation/ASTFire/test_stage8_integrated.py
          python -m py_compile Automation/ASTFire/test_stage9_unbounded.py
          python Automation/ASTFire/test_stage9_unbounded.py
          python -m py_compile Automation/ASTFire/setup_stage10_lifecycle.py
          python -m py_compile Automation/ASTFire/verify_stage10_gpu.py
          python -m py_compile Automation/ASTFire/test_stage10_lifecycle.py
          python -m py_compile Automation/ASTFire/test_stage14_mantle_neck.py
          python -m py_compile Automation/ASTFire/test_stage16_coverage_variance.py
          python -m py_compile Automation/ASTFire/test_stage17_tip_detachment.py
          python -m py_compile Automation/ASTFire/test_stage18_palette_plume.py
          python -m py_compile Automation/ASTFire/test_stage19_live_silhouette.py
          python -m py_compile Automation/ASTFire/test_stage20_detached_billboard.py
          python -m py_compile Automation/ASTFire/test_stage21_burn_lifetime.py
          python Automation/ASTFire/test_stage21_burn_lifetime.py
          python -m py_compile Automation/ASTFire/setup_stage22_char.py
          python -m py_compile Automation/ASTFire/test_stage22_char.py
          python Automation/ASTFire/test_stage22_char.py
          python -m py_compile Automation/ASTFire/test_stage23_sparks.py
          python Automation/ASTFire/test_stage23_sparks.py
          python -m py_compile Automation/ASTFire/setup_stage24_smoke.py
          python -m py_compile Automation/ASTFire/test_stage24_smoke.py
          python Automation/ASTFire/test_stage24_smoke.py
          python -m py_compile Automation/ASTFire/test_stage25_permanent_sources.py
          python Automation/ASTFire/test_stage25_permanent_sources.py
          python -m py_compile Automation/ASTFire/test_stage26_char_visibility.py
          python Automation/ASTFire/test_stage26_char_visibility.py
          python -m py_compile Automation/ASTFire/test_stage27_smoke_material.py
          python Automation/ASTFire/test_stage27_smoke_material.py
          python -m py_compile Automation/ASTFire/test_stage28_player_recovery.py
          python Automation/ASTFire/test_stage28_player_recovery.py
          python -m py_compile Automation/ASTFire/test_stage29_smoke_silhouette.py
          python Automation/ASTFire/test_stage29_smoke_silhouette.py
          python -m py_compile Automation/ASTFire/setup_stage30_sparks.py
          python -m py_compile Automation/ASTFire/test_stage30_sparks_visible.py
          python Automation/ASTFire/test_stage30_sparks_visible.py
          python -m py_compile Automation/ASTFire/test_stage31_continuous_plume.py
          python Automation/ASTFire/test_stage31_continuous_plume.py
          python -m py_compile Automation/ASTFire/test_stage32_spark_vortex.py
          python Automation/ASTFire/test_stage32_spark_vortex.py
          python -m py_compile Automation/ASTFire/test_stage33_density_smoke.py
          python Automation/ASTFire/test_stage33_density_smoke.py
          python -m py_compile Automation/ASTFire/verify_stage24_materials_gpu.py
          python Automation/ASTFire/test_stage4_source.py
          # V3 visual snapshot tests above are syntax-checked for rollback history.
          # V4 replaces their raster-specific assertions with a current contract.
          python -m py_compile Automation/ASTFire/setup_fire_v4.py
          python -m py_compile Automation/ASTFire/test_fire_v4.py
          python -m py_compile Automation/ASTFire/verify_fire_v4_gpu.py
          python Automation/ASTFire/test_fire_v4.py
      - name: Parse PowerShell deployment script
        shell: pwsh
        run: |
          foreach ($path in @(
            "Automation/ASTFire/deploy_stage2_windows.ps1",
            "Automation/ASTFire/deploy_stage4_windows.ps1",
            "Automation/ASTFire/deploy_stage5_verified_windows.ps1",
            "Automation/ASTFire/deploy_stage6_windows.ps1",
            "Automation/ASTFire/deploy_stage8_windows.ps1",
            "Automation/ASTFire/deploy_stage9_windows.ps1",
            "Automation/ASTFire/deploy_stage10_windows.ps1",
            "Automation/ASTFire/deploy_stage33_smoke_windows.ps1",
            "Automation/ASTFire/deploy_fire_v4_windows.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
          }
      - name: Verify intended project boundaries
        shell: python
        run: |
          from pathlib import Path
          import json

          root = Path("Plugins/ASTFireRuntime")
          metadata = json.loads((root / "ASTFireRuntime.uplugin").read_text())
          assert {"ASTFireRuntime", "ASTFireEditor"} == {
              item["Name"] for item in metadata["Modules"]
          }
          assert any(
              item["Name"] == "Niagara" and item["Enabled"]
              for item in metadata.get("Plugins", [])
          )

          finalizer = Path("Automation/ASTFire/finalize_stage2.py").read_text()
          assert "NE_AST_Fire_" in finalizer
          assert " + \"_V2\"" in finalizer
          assert "BP_AST_FireSource" in finalizer
          assert "BP_Torch_U" in finalizer
          assert "duplicate_asset(template, destination)" in finalizer

          runtime = (root / "Source/ASTFireRuntime/Private/ASTFireReactiveComponent.cpp").read_text()
          assert "OnComponentBeginOverlap.AddDynamic" in runtime
          assert "GetPlayerControllerIterator" not in runtime
          assert "SetIntensity" in runtime
          assert "SetVariableFloat" in runtime

          editor = (root / "Source/ASTFireEditor/Private/ASTFireEditorLibrary.cpp").read_text()
          assert "AddEmitterHandle" in editor
          assert "RequestCompile" in editor

          print("AST Fire Python syntax and source structure: OK")
